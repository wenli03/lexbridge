# =============================================================================
# ArchUnit 配置
# =============================================================================
#
# failOnEmptyShould=false —— 允许规则"没有匹配到任何类"时通过。
#
# 为什么必须开：本项目按阶段交付，domain / application 等包在 P0 时是空的，
# 到 P1 才逐步填充。若保持默认（空即失败），则每个尚未填充的层都会让构建挂掉，
# 结果是这条门禁在真正需要它之前就被注释掉了——那才是最坏的结果。
#
# **这个开关的代价必须用别的手段补上**：它会让包名拼写错误静默通过
# （比如把 "..domain.." 写成 "..domian.."，规则永远匹配不到任何类却始终"通过"）。
# 因此 ArchitectureTest 里另有一个 PackagePresenceTest，
# 在包应当存在时断言其非空——用另一个测试去兜住这个开关的风险，
# 而不是靠人记得检查。
#
# 相关：一旦某个包已经确定会有类，就应当从 PackagePresenceTest 的
# "预期非空"清单里去掉对应豁免。
archRule.failOnEmptyShould=false
