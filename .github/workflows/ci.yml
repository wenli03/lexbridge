# =============================================================================
# 持续集成
# =============================================================================
# 三条贯穿全流程的原则：
#
# 1. **不需要任何密钥。** 模型相关的一切走 replay / mock 模式
#    （见 docs/decision-record.md D-09 与《详细设计》§11.4）。这不是妥协，是设计：
#    把 API Key 放进公开仓库的 Secrets，就多了一个可能泄露的地方，
#    而 CI 要验证的是代码正确性，不是模型服务可用性。
#
# 2. **架构规则是构建门禁，不是文档约定。** DR-1/DR-2 由 ArchUnit 强制，
#    DR-3/DR-4 由 import-linter 强制。违反分层会直接让 CI 失败。
#
# 3. **密钥扫描在最早的位置。** 一旦推上去，即使立刻删除，
#    fork 与各类缓存里仍然留着。
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一次运行，避免排队
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.11'
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

  # 钉住 uv 使用的解释器版本，而不是让它自己挑。
  #
  # **这条不是冗余配置，是修一个真实故障。** `requires-python` 允许 3.11 与 3.12，
  # 而 `ai-service/.python-version` 当时不存在，于是 uv 在本地挑到 3.11、
  # 在 CI 的 Linux runner 上挑到 3.12。后果不是"装错依赖"这么温和：
  # numpy 的 3.12 存根里用了 `type` 语句，而 mypy 按 3.11 解析它，
  # 报 "Type statement is only supported in Python 3.12 and greater"，
  # 错误指向 numpy，真正的原因是两处对"跑在哪个 Python 上"给了不同答案。
  #
  # 生产镜像是 `python:3.11-slim`，所以 3.11 是事实上的目标版本。
  UV_PYTHON: '3.11'

jobs:

  # ===========================================================================
  # 密钥扫描 —— 最先跑，最快失败
  # ===========================================================================
  secret-scan:
    name: 预检（密钥与脚本权限）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # 纯标准库，无需安装依赖——扫描器本身不应该有依赖，
      # 否则"扫描失败"与"装不上依赖"会难以区分
      - name: 扫描将被提交的文件
        run: python scripts/verify_no_secrets.py

      # 这一条守的是 Windows 作者几乎必然会踩、且**在 Windows 上不可能发现**的问题：
      # `core.filemode` 默认为 false，git 一律记成 100644，于是带 shebang 的
      # backend/mvnw 在 Linux 上执行时是 "Permission denied"——
      # 那条错误看起来像 runner 的问题或路径写错，而真正的原因是少了一个权限位。
      #
      # 放在这个 job 而不是 java job 里：这里是最先跑、最快失败的地方，
      # 而问题与 Java 无关（同样的坑也会打在任何 shell 脚本上）。
      - name: 检查脚本可执行位
        run: python scripts/verify_exec_bits.py

  # ===========================================================================
  # Python AI 服务
  # ===========================================================================
  ai-service:
    name: AI 服务（Python）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --frozen --extra dev

      - name: 代码风格与静态检查
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 类型检查
        run: uv run mypy app

      # DR-3 / DR-4 在此强制。
      # 最关键的是 DR-4：redline 不得 import chains —— 红线判定若依赖
      # 模型生成，就存在"模型被说服后绕过红线"的风险。
      - name: 架构契约（import-linter）
        run: uv run lint-imports

      - name: 单元测试
        env:
          # 显式指定回放模式：即使有人在环境里设置了密钥也不会走真实调用
          MODEL_MODE: replay
        run: uv run pytest -m "not real_api"

  # ===========================================================================
  # Java 业务主干
  # ===========================================================================
  api-service:
    name: 业务主干（Java）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # ArchUnit 架构测试在 test 阶段执行（见 ArchitectureTest）。
      # 它们会随业务代码的增长而逐步生效——当前 domain 层还没有类，
      # 对应的规则暂时是空转的，这是分阶段交付的必然状态。
      - name: 编译与测试（含架构门禁）
        working-directory: backend
        run: ./mvnw -B verify

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  # ===========================================================================
  # 前端
  # ===========================================================================
  frontend:
    name: 前端（Vue）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci --no-audit --no-fund

      - name: 类型检查
        run: npm run type-check

      # DR-6 在此强制：前端只有 api 层能发起网络请求。
      # 越过 api 层直接 fetch 的代码能跑、能过类型检查、能过功能测试，
      # 只是绕过了认证头注入、traceId 生成、错误归一与 401 统一处置。
      - name: ESLint（含 DR-6 架构规则）
        run: npx eslint . --max-warnings 0

      - name: 构建
        run: npm run build

  # ===========================================================================
  # 容器镜像构建
  # ===========================================================================
  docker-build:
    name: 镜像构建
    runs-on: ubuntu-latest
    needs: [secret-scan]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: backend
          - name: ai
            context: ai-service
          - name: web
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # 只构建不推送：验证 Dockerfile 可用，不产生任何镜像仓库副作用
      - name: 构建 ${{ matrix.name }} 镜像
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # 端到端冒烟 —— 验证中断恢复与租户隔离
  # ===========================================================================
  checkpoint-smoke:
    name: 检查点冒烟（中断恢复）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: lexbridge
          POSTGRES_USER: lexbridge
          POSTGRES_PASSWORD: ci_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexbridge -d lexbridge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        working-directory: ai-service
        run: uv sync --frozen --extra dev

      # 建 schema 与应用角色。与 deploy/initdb 做同样的事，
      # 但 CI 里 service container 不支持 initdb 脚本目录，
      # 因此在这里显式执行等价语句。
      - name: 初始化数据库 schema
        env:
          PGPASSWORD: ci_only_password
        run: |
          psql -h localhost -U lexbridge -d lexbridge -v ON_ERROR_STOP=1 <<'SQL'
            CREATE EXTENSION IF NOT EXISTS vector;
            CREATE EXTENSION IF NOT EXISTS pg_trgm;
            CREATE EXTENSION IF NOT EXISTS unaccent;
            CREATE SCHEMA IF NOT EXISTS kb;
            CREATE SCHEMA IF NOT EXISTS app;
            CREATE SCHEMA IF NOT EXISTS runtime;
            GRANT USAGE, CREATE ON SCHEMA kb, app, runtime TO lexbridge;
          SQL

      # 这一项验证 R2：中断恢复时，中断前的节点不会重跑。
      # 若它变成重跑，真实场景里意味着重复的模型调用与重复计费。
      - name: 检查点中断恢复与并发
        working-directory: ai-service
        env:
          DB_URL_OVERRIDE: postgresql://lexbridge:ci_only_password@localhost:5432/lexbridge
          LANGGRAPH_STRICT_MSGPACK: 'true'
        run: uv run python ../scripts/smoke_checkpoint_interrupt.py
