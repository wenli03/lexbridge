# =============================================================================
# 本地开发覆盖层 —— 需显式启用
# =============================================================================
# 基础 compose 刻意不发布 postgres / redis 的宿主端口，这是攻击面收敛的一部分
# （物理视图 6.2，支撑 AC-5.1）。但本地跑单测、连库排查没有端口会很难受。
#
# 用法（**必须显式列出两个文件**）：
#   docker compose -f deploy/docker-compose.yml -f deploy/docker-compose.override.yml up -d
#
# 注意：一旦用了 -f 显式指定文件，compose 就**不再自动加载** override 文件。
# 想验证纯净拓扑时只给第一个 -f 即可，本文件自然被忽略。
#
# -----------------------------------------------------------------------------
# 为什么需要 devnet 这条网络
# -----------------------------------------------------------------------------
# 踩过的坑：只给 postgres 加 `ports:` 是不生效的。容器只挂在 backnet 上，
# 而 backnet 声明为 internal: true —— 这类网络没有网关，
# Docker 无法为其建立宿主端口转发。症状很有迷惑性：
#   · `docker compose config` 里 published 端口写得好好的
#   · `HostConfig.PortBindings` 也记录了绑定意图
#   · 但 `NetworkSettings.Ports` 是空的，`docker ps` 的 PORTS 列只有 `5432/tcp`
#   · 宿主上 Test-NetConnection 返回 False
#
# 解法是给这两个容器额外挂一条普通 bridge。devnet 只用于端口转发，
# 不承载任何服务间通信——服务间仍然走 backnet。
# =============================================================================

services:

  postgres:
    ports:
      # 固定 127.0.0.1 前缀是刻意的。写成 "5433:5432" 会绑到所有网卡，
      # 在公共 WiFi 上等于把数据库敞开。
      # 宿主用 5433 而非 5432，避免与本机可能已装的 PostgreSQL 冲突。
      - "127.0.0.1:5433:5432"
    networks:
      - backnet
      - devnet

  redis:
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - backnet
      - devnet

networks:
  devnet:
    driver: bridge
