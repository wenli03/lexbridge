# =============================================================================
# LexBridge 前端 nginx 配置
# =============================================================================
# 职责有二：提供前端静态产物，以及把 /api 反代到后端。
# 对应物理视图 6.2：浏览器只与 web 通信，web 是唯一对外暴露的端口。
# =============================================================================

server {
    listen 80;
    # 显式监听 IPv6。
    #
    # 不加这一行的症状很有迷惑性：服务从宿主访问完全正常（走 IPv4 端口映射），
    # 但容器**内部**的 `wget http://localhost/healthz` 报 Connection refused ——
    # 因为 Alpine 的 wget 把 localhost 优先解析到 ::1，而只写 `listen 80;`
    # 时 nginx 只绑 0.0.0.0:80。
    #
    # 于是 docker 健康检查永远失败，而人手工 curl 宿主机端口却是通的。
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 不泄露版本号：响应头里的 nginx 版本对排查没有帮助，对攻击者有
    server_tokens off;

    # -------------------------------------------------------------------------
    # 安全响应头
    # -------------------------------------------------------------------------
    # 这是个内部法务工具，页面里会出现案情与法条原文。以下几项的作用是
    # 限制页面被嵌入、被嗅探、以及被外站拿到 referrer。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    # 不使用任何外部资源，因此 CSP 可以收得很紧。
    # 'unsafe-inline' 用于 style 是 Vue 的 scoped 样式注入所需；
    # script 侧的 'unsafe-inline' 是不需要的，加上就等于放弃了 CSP 的主要价值。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # -------------------------------------------------------------------------
    # 健康检查
    # -------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain always;
    }

    # -------------------------------------------------------------------------
    # SSE 流式接口 —— 必须放在通用 /api 之前
    # -------------------------------------------------------------------------
    # 这是全站最容易配错的一段。
    #
    # nginx 默认会缓冲上游响应，效果是：后端已经流式吐了几十帧，
    # 浏览器那边一直是空白，直到响应结束才一次性显示全部内容。
    # 表现上"功能正常"，只是失去了流式的全部意义——而这类问题
    # 在功能测试里不会暴露，只有真人盯着屏幕看才会发现。
    # 用正则而不是前缀匹配，因为流式端点有三个，且路径中段带 ID：
    #   /api/consult-sessions/{id}/runs/{runId}/stream   咨询结果流
    #   /api/consult-sessions/{id}/runs/{runId}/resume   补充信息后的恢复流（同样是 SSE）
    #   /api/knowledge/jobs/{jobId}/stream               入库进度流
    # 写死某一条前缀的后果是另外两条走通用 /api 分支被缓冲——表现是
    # "咨询能出结果但不是一个字一个字出来"，而入库进度干脆不动。
    location ~ ^/api/(consult-sessions/.*/(stream|resume)|knowledge/jobs/[^/]+/stream)$ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        # ---- 关闭缓冲的三件套，缺一不可 ----
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header X-Accel-Buffering no;

        # SSE 用 chunked 传输
        proxy_set_header Connection '';
        chunked_transfer_encoding on;

        # ---- 长连接超时 ----
        # 一次咨询可能跑几十秒，且中间会有"模型正在思考"的空窗期。
        # 默认 60s 的读超时会让长时间无输出的查询被切断。
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;

        # 不压缩：压缩会把分帧缓冲掉，等于又开了一次缓冲
        gzip off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 追踪 ID 必须透传，否则前后端日志无法对齐
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # -------------------------------------------------------------------------
    # 通用 API 反向代理
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $http_x_request_id;

        # 文件上传可能较大
        client_max_body_size 100m;
        proxy_read_timeout 180s;
    }

    # -------------------------------------------------------------------------
    # 静态产物
    # -------------------------------------------------------------------------
    # 带 hash 的资源可以长期缓存——文件名变了内容才会变
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html **绝不能缓存**。
    # 缓存了它，用户会在新版本发布后继续加载旧页面，而旧页面引用的
    # 资源文件已经被替换掉，结果是白屏。这类问题只在发布后对部分用户出现，
    # 极难复现。
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
        expires 0;
    }

    # SPA 路由回退：前端用的是 history 模式，
    # 直接访问 /consult 时服务端并没有这个文件，必须回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
