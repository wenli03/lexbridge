[project]
name = "lexbridge-ai"
version = "0.1.0"
description = "LexBridge AI 服务：LangChain / LangGraph / DeepAgent / LlamaIndex"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }

# 版本下限来自 docs/decision-record.md 的实测与核实（2026-09-30）。
# 使用 >= 而非 == 是为了兼容安全补丁；镜像构建时由 uv.lock 锁定具体版本。
dependencies = [
    # --- Web 框架（A-7：属双运行时下的实现细节，不作为独立技术选型） ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.0",

    # --- 配置与校验 ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # --- LangChain 基础开发底座 ---
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    # 走 OpenAI 兼容协议访问硅基流动
    "langchain-openai>=0.2.0",

    # --- LangGraph 流程编排引擎 ---
    "langgraph>=0.2.40",
    # 检查点持久化。注意这是**独立包**，不内置于 langgraph。
    # 随包安装 psycopg3，因此本服务的数据库访问统一走 psycopg3，不引入 asyncpg。
    "langgraph-checkpoint-postgres>=2.0.0",

    # --- DeepAgent 高阶智能体封装 ---
    # 构建在 LangGraph 之上。规划工具自 0.7 起为 opt-in，需显式传 TodoListMiddleware。
    "deepagents>=0.7.0",

    # --- LlamaIndex：解析 / 切分 / 索引 ---
    "llama-index-core>=0.12.0",
    "llama-index-readers-file>=0.4.0",
    # 版面解析用 PyMuPDFReader：pypdf 拿不到坐标与字号，
    # 而还原「编/章/节/条/款/项」层级必须靠字号与坐标。
    "pymupdf>=1.24.0",

    # --- 数据库与向量 ---
    # 全程只用 psycopg3（同步+异步）。不用 asyncpg：
    # LangGraph 检查点包已装 psycopg3，再引入 asyncpg 会得到两套连接池。
    "psycopg[binary,pool]>=3.2.0",
    "pgvector>=0.3.6",

    # --- 缓存与任务队列 ---
    "redis>=5.2.0",

    # --- LangSmith：调试与监控 ---
    "langsmith>=0.1.140",
    "openevals>=0.1.0",

    # --- 工具 ---
    "httpx>=0.27.0",
    "tenacity>=9.0.0",
    "python-multipart>=0.0.12",
    "PyJWT>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    # 强制 DR-4：redline 不得 import chains
    "import-linter>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# =============================================================================
# Ruff —— 同时承担 lint 与格式
# =============================================================================
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "ASYNC",    # flake8-async：异步代码里的阻塞调用
    "S",        # flake8-bandit：安全问题
    "T20",      # flake8-print：库代码里不应有 print
]
ignore = [
    "E501",    # 行长由 formatter 负责
    "S101",    # 测试里允许 assert
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
"scripts/**" = ["T20"]        # 冒烟脚本的输出就是它的产出，print 是正当的
"app/core/logging.py" = ["T20"]
# 内部端点的请求/响应模型要与 Java 侧（以及《详细设计》§2.3 冻结的字段表）逐字一致，
# 因此字段名必须是 camelCase。这里的 N815 是"线上契约优先于本地命名习惯"的例外，
# 而不是放宽标准：改成 snake_case 会让两侧契约靠转换层粘合，而转换层是漂移的来源。
"app/api/**" = ["N815"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# =============================================================================
# mypy
# =============================================================================
[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# 第三方包缺 type stub，逐个放开而不是全局 ignore_missing_imports
module = [
    "deepagents.*",
    "llama_index.*",
    "pgvector.*",
    "openevals.*",
]
ignore_missing_imports = true

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "real_api: 需要真实硅基流动 API 与余额，默认不跑",
    "slow: 耗时较长的测试",
]

# =============================================================================
# import-linter —— 把架构规则变成 CI 门禁
# =============================================================================
[tool.importlinter]
root_package = "app"

[[tool.importlinter.contracts]]
name = "DR-4：redline 不得依赖 chains（红线判定不得依赖模型生成）"
type = "forbidden"
source_modules = ["app.redline"]
forbidden_modules = ["app.chains", "app.graph", "app.agents"]

[[tool.importlinter.contracts]]
name = "DR-3：graph 不得直接操作数据库（只能经 retrieval / ontology）"
type = "forbidden"
source_modules = ["app.graph"]
forbidden_modules = ["app.core.db"]

[[tool.importlinter.contracts]]
name = "retrieval 不得依赖 graph（避免循环）"
type = "forbidden"
source_modules = ["app.retrieval"]
forbidden_modules = ["app.graph"]

[[tool.importlinter.contracts]]
name = "chains 不得依赖 graph（分层：graph 调 chains，反之不可）"
type = "forbidden"
source_modules = ["app.chains"]
forbidden_modules = ["app.graph"]

[[tool.importlinter.contracts]]
name = "core 是最底层，不得依赖任何业务模块"
type = "forbidden"
source_modules = ["app.core"]
forbidden_modules = [
    "app.graph", "app.chains", "app.retrieval", "app.ontology",
    "app.wiki", "app.redline", "app.agents", "app.indexing",
]

[[tool.importlinter.contracts]]
name = "分层：api → graph → {chains, retrieval, redline, wiki} → ontology"
type = "layers"
layers = [
    "app.api",
    "app.observability | app.agents",
    "app.graph",
    "app.chains | app.retrieval | app.redline | app.wiki | app.indexing",
    "app.ontology",
    "app.core",
]
